<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCC Cast | Change Password</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/lcccast_logo.png" />
    <link rel="apple-touch-icon" href="/images/lcccast_logo.png" />

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/voter/password-handler.css" />
    <link rel="stylesheet" href="/css/modal.css" />
    <link rel="stylesheet" href="/css/password-rules.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
      /* Thymeleaf used th:if so an empty message never existed; here the span always exists, so hide it while empty */
      .inline-error.server-error:empty { display: none; }
    </style>
    <script src="/js/theme.js"></script>
  </head>

  <body>
    <div class="login-page">
      <main class="login-container">

        <div class="change-password-header">
          <h2>Hello, <span>{{displayName}}</span></h2>
          <p class="password-subtext">Please change your password before proceeding.</p>
        </div>

        <form id="changePasswordForm" action="/voter/change-password" method="post" novalidate>

          <div class="login-form-group">
            <label for="password"> Password </label>

            <div class="password-field">
              <input
                      type="password"
                      id="password"
                      name="password"
                      autocomplete="new-password"
                      placeholder="Enter your new password"
              />
              <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>

            <span class="inline-error" id="passwordError"></span>
            <small id="newPasswordStrength" class="password-strength-message"></small>
          </div>

          <div class="login-form-group">
            <label for="confirmPassword"> Confirm Password </label>

            <div class="password-field">
              <input
                      type="password"
                      id="confirmPassword"
                      name="confirmPassword"
                      autocomplete="new-password"
                      placeholder="Confirm your new password"
              />
              <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>

            <span class="inline-error" id="confirmPasswordError"></span>
          </div>

          <!-- Server Error (filled by the server when the save fails) -->
          <span class="inline-error server-error" id="changePasswordServerError">{{passwordError}}</span>

          <button type="submit" class="login-button" id="savePasswordBtn">Save Password</button>

        </form>

      </main>
    </div>

    <!-- ACTION LOADING MODAL -->
    <div class="modal-overlay loading-modal-overlay" id="actionLoadingModal" aria-hidden="true">
      <div class="action-loading-modal" role="dialog" aria-modal="true" aria-labelledby="actionLoadingTitle">
        <div class="action-loading-spinner"><span></span></div>

        <div class="action-loading-content">
          <h2 id="actionLoadingTitle">Please Wait</h2>
          <p id="actionLoadingMessage">Saving your new password...</p>
        </div>
      </div>
    </div>

    <script src="/js/password-rules.js"></script>
    <script src="/js/voter/password-handler.js"></script>
  </body>
</html>
